name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm test
      - name: CLI exits 3 on a watermelon
        run: |
          set +e
          echo 'Status: green. Blocked, 3 weeks late.' | node bin/watermelon.js -
          test $? -eq 3
      # Mock eval only: proves the eval harness runs. Real numbers come from `npm run eval` with a key.
      - run: npm run eval:mock > /dev/null
      - run: node evals/run.mjs --mock --candidates > /dev/null
      # Re-scores the committed real-Jev answers: fails if a labelled case has no stored answer.
      - run: npm run eval:rescore > /dev/null && npm run eval:gap > /dev/null
      - run: npx wrangler deploy --dry-run
